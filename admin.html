<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lenco v2.1 • Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    .glass { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(148, 163, 184, 0.25); }
  </style>
</head>
<body class="gradient-bg min-h-screen text-slate-200">

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-6">
    <div class="glass max-w-md w-full rounded-3xl p-8">
      <div class="flex items-center gap-3 mb-8">
        <div class="text-4xl">💸</div>
        <h1 class="text-3xl font-bold">Lenco v2.1</h1>
      </div>
      <input id="email" type="email" placeholder="admin@yourcompany.zm" class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-5 py-4 text-white mb-3">
      <input id="password" type="password" placeholder="Password" class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-5 py-4 text-white mb-6">
      <button onclick="app.login()" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-2xl font-semibold text-lg">Login</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-screen" class="hidden min-h-screen flex flex-col">
    <header class="glass sticky top-0 z-50 border-b border-slate-700">
      <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <span class="text-3xl">💸</span>
          <span class="font-bold text-2xl">Lenco Admin</span>
        </div>
        <div class="flex items-center gap-4">
          <div id="user-email" class="text-slate-300"></div>
          <button onclick="app.logout()" class="px-6 py-2 bg-slate-800 hover:bg-slate-700 rounded-2xl text-sm">Logout</button>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto w-full px-6 py-8">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="glass rounded-3xl p-6">
          <p class="text-slate-400">Total Balance</p>
          <p id="total-balance" class="text-5xl font-bold text-white mt-2">ZMW 0.00</p>
        </div>
        <div class="glass rounded-3xl p-6">
          <p class="text-slate-400">Pending</p>
          <p id="pending-count" class="text-5xl font-bold text-amber-400 mt-2">0</p>
        </div>
        <div class="glass rounded-3xl p-6">
          <p class="text-slate-400">Successful Today</p>
          <p id="success-count" class="text-5xl font-bold text-emerald-400 mt-2">0</p>
        </div>
      </div>

      <div class="glass rounded-3xl p-6">
        <h2 class="text-xl font-semibold mb-4">Recent Collections</h2>
        <table class="w-full">
          <thead>
            <tr class="text-xs text-slate-400 border-b">
              <th class="text-left py-4">Reference</th>
              <th class="text-left py-4">Channel</th>
              <th class="text-left py-4">Amount</th>
              <th class="text-left py-4">Status</th>
              <th class="text-left py-4">Date</th>
            </tr>
          </thead>
          <tbody id="collections-body" class="divide-y divide-slate-700 text-sm"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    const WORKER_URL = "https://lenco.nickchansa24.workers.dev";
    const ORGANIZATION_ID = "67e9f077-4fcc-4741-b20a-64be71230892";

    const app = {
      supabase: null,
      collections: [],

      async login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
          // Get Supabase config from your worker
          const configRes = await fetch(`${WORKER_URL}/config`);
          const config = await configRes.json();

          // FIXED: Correct global name from UMD build
          this.supabase = Supabase.createClient(config.supabase_url, config.supabase_anon_key);

          const { data, error } = await this.supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;

          document.getElementById("auth-screen").classList.add("hidden");
          document.getElementById("dashboard-screen").classList.remove("hidden");
          document.getElementById("user-email").textContent = email;

          this.loadDashboard();
        } catch (err) {
          alert("Login failed: " + err.message);
        }
      },

      async loadDashboard() {
        await this.loadCollections();
      },

      async loadCollections() {
        const tbody = document.getElementById("collections-body");
        tbody.innerHTML = `<tr><td colspan="5" class="py-12 text-center text-slate-400">Loading collections...</td></tr>`;

        try {
          const res = await fetch(`${WORKER_URL}/api/collections?organization_id=${ORGANIZATION_ID}`);
          const json = await res.json();

          this.collections = json.data || [];
          this.renderCollections();
        } catch (err) {
          tbody.innerHTML = `<tr><td colspan="5" class="py-12 text-center text-red-400">Failed to load collections</td></tr>`;
        }
      },

      renderCollections() {
        const tbody = document.getElementById("collections-body");
        if (this.collections.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="py-12 text-center text-slate-400">No collections yet</td></tr>`;
          return;
        }

        tbody.innerHTML = this.collections.map(c => `
          <tr class="border-b border-slate-700 hover:bg-slate-800/30">
            <td class="px-4 py-4 font-mono text-blue-400">${c.reference}</td>
            <td class="px-4 py-4">${c.channel}</td>
            <td class="px-4 py-4 font-semibold">ZMW ${Number(c.amount).toFixed(2)}</td>
            <td class="px-4 py-4">
              <span class="px-3 py-1 rounded-full text-xs ${c.status === 'success' ? 'bg-emerald-400/20 text-emerald-400' : c.status === 'pending' ? 'bg-amber-400/20 text-amber-400' : 'bg-red-400/20 text-red-400'}">
                ${c.status}
              </span>
            </td>
            <td class="px-4 py-4 text-xs">${new Date(c.initiated_at).toLocaleDateString()}</td>
          </tr>
        `).join('');
      },

      logout() {
        location.reload();
      }
    };
  </script>
</body>
</html>
